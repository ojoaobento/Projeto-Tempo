<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Paraná Preparado</title>
</head>
<body>
    <nav>
        <div class="parana">
            <div class="shield-nav">
                <span class="icone-shield">
                    shield
                </span>
            </div>
            <h1>
                Paraná Preparado
            </h1>
        </div>
        <div class="bloco-nav">
            <div class="maringa">
                <span class="icone-warning">
                    warning
                </span>
                <p>
                    Maringá: Atenção
                </p>
            </div>
            <div class="ligar">
                <span class="icone-ligar">
                    phone
                </span>
                <h1>
                    Ligar 199
                </h1>
            </div>
        </div>
    </nav>

    <hr class="linha">

    <header>
        
        <div>
            <div class="ajuda">

                <span class="icone-emergencia ">emergency</span>

                <h1>
                    Precisa de Ajuda?
                </h1>
            </div>


            <div class="cards">


                <div class="card-defesa">
                    <div class="cards-dentro-defesa">
                        <span class="icones-cards">shield</span>
                        <p>Defesa Civil</p>
                        <span class="icones-cards-phone">phone</span>
                    </div>
                    <p class="telefone">199</p>
                </div>

                <div class="card">
                    <div class="cards-dentro">
                        <span class="icones-cards">local_fire_department</span>
                        <p>Bombeiros</p>
                        <span class="icones-cards-phone">phone</span>
                    </div>
                    <p class="telefone">193</p>
                </div>

                <div class="card">
                    <div class="cards-dentro-samu">
                        <span class="icones-cards">medical_services</span>
                        <p>Samu</p>
                        <span class="icones-cards-phone">phone</span>
                    </div>
                    <p class="telefone">192</p>
                </div>

                <div class="card">
                    <div class="cards-dentro">
                        <span class="icones-cards">local_police</span>
                        <p>Polícia Militar</p>
                        <span class="icones-cards-phone">phone</span>
                    </div>
                    <p class="telefone">190</p>
                </div>
            </div>

        </div>

    </header>
    
</body>
</html>
